<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>On se fait un ciné ? 🍿</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .floating { animation: float 3s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#F7F4EF] min-h-screen flex items-center justify-center p-4 text-[#4A3B32] font-sans">

  <div class="bg-white/80 backdrop-blur-md p-8 rounded-2xl shadow-xl border border-[#E6DEC9] text-center max-w-md w-full relative overflow-hidden">
    
    <!-- Étape 1 : L'Invitation -->
    <div id="invitation">
      <div class="text-5xl mb-3 floating">🍿🎬</div>
      <p class="text-xs uppercase tracking-widest text-[#8C6D62] mb-1">Pour toi</p>
      <h1 class="text-3xl font-serif text-[#5C1D24] mb-3 font-bold">Ça te dit un ciné ?</h1>
      <p class="text-sm text-[#7D6B63] mb-8 italic">(dire non ne sert à rien, mais tu peux essayer)</p>

      <div class="flex items-center justify-center gap-4 relative min-h-[60px] mb-8">
        <button id="yesBtn" class="bg-[#5C1D24] hover:bg-[#732630] text-white font-medium py-3 px-8 rounded-lg shadow-md transition text-base">
          Oui
        </button>
        <button id="noBtn" class="bg-transparent border border-[#5C1D24]/30 hover:border-[#5C1D24] text-[#5C1D24] font-medium py-3 px-8 rounded-lg transition text-base">
          Non
        </button>
      </div>

      <!-- QR Code intégré -->
      <div class="pt-6 border-t border-[#E6DEC9] text-center">
        <p class="text-xs text-[#8C6D62] mb-2 font-medium">Scanne pour ouvrir sur ton téléphone :</p>
        <img id="qrCodeImg" src="" alt="QR Code de l'invitation" class="mx-auto w-24 h-24 p-1 bg-white rounded-lg shadow-sm border border-[#E6DEC9]" />
      </div>
    </div>

    <!-- Étape 2 : Succès -->
    <div id="success" class="hidden">
      <div class="text-5xl mb-4">🥳🎉</div>
      <h2 class="text-3xl font-serif text-[#5C1D24] font-bold mb-2">Rendez-vous pris !</h2>
      <p class="text-[#7D6B63] mb-6 text-sm">Prépare tes recommandations de films.</p>
      <a id="whatsappBtn" href="#" target="_blank" class="inline-block bg-[#25D366] hover:bg-[#22bf5b] text-white font-medium py-3 px-6 rounded-lg shadow-md transition text-sm">
        Confirmer sur WhatsApp 📲
      </a>
    </div>

  </div>

  <script>
    // Génération automatique du QR code basé sur l'URL actuelle du site
    const currentUrl = window.location.href;
    document.getElementById('qrCodeImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}`;

    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const invitation = document.getElementById('invitation');
    const success = document.getElementById('success');
    const whatsappBtn = document.getElementById('whatsappBtn');

    const phrases = [
      "Tu es sûre ?",
      "Sérieusement ?",
      "Un petit effort 🥺",
      "Il y aura du pop-corn !",
      "Mauvaise touche !",
      "Essaie encore 😜"
    ];
    let phraseIndex = 0;

    function moveNoButton() {
      noBtn.innerText = phrases[phraseIndex % phrases.length];
      phraseIndex++;
      
      const maxX = 200;
      const maxY = 100;
      const randomX = (Math.random() - 0.5) * maxX;
      const randomY = (Math.random() - 0.5) * maxY;
      
      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('click', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener('click', () => {
      invitation.classList.add('hidden');
      success.classList.remove('hidden');
      
      const message = encodeURIComponent("C'est bon pour le ciné ! 🍿");
      whatsappBtn.href = `https://wa.me/?text=${message}`;
    });
  </script>
</body>
</html>
