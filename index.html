<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>InviteCiné — Cartes Magiques & Invitations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.5s ease; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    .btn-moving { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    input, select, textarea { font-size: 16px !important; }
    
    /* ANCIENNE AMBIANCE COULEUR MARRON / CHOCOLAT & CHALEUREUSE */
    body { background: linear-gradient(135deg, #3d1c14, #5c2c16, #26110b); color: #fdf8f6; }

    /* ANIMATION DU CHAT */
    @keyframes walk {
      0% { transform: translateX(-50px) scaleX(1); }
      49.9% { transform: translateX(calc(100vw - 50px)) scaleX(1); }
      50% { transform: translateX(calc(100vw - 50px)) scaleX(-1); }
      99.9% { transform: translateX(-50px) scaleX(-1); }
      100% { transform: translateX(-50px) scaleX(1); }
    }
    .animated-cat {
      position: fixed;
      bottom: 8px;
      left: 0;
      font-size: 28px;
      animation: walk 16s infinite linear;
      z-index: 99;
      pointer-events: none;
    }

    /* ANIMATION DE SORTIE DE L'ENVELOPPE */
    @keyframes slideUpCard {
      0% { transform: translateY(60px) scale(0.9); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .card-appear {
      animation: slideUpCard 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
